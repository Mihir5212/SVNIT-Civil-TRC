<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll to Construct — Isometric CAD Blueprint</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1e1e1e;
      color: #e0e0e0;
      font-family: "Courier New", Courier, monospace;
      overflow-x: hidden;
    }
    /* Tall container creates the scroll track */
    .scroll-track {
      height: 600vh;
      position: relative;
    }
    /* Sticky viewport holds the 3D canvas and HUD */
    .viewport {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #262626 0%, #1a1a1a 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* HUD Overlays */
    .hud-bottom-left {
      position: absolute;
      bottom: 28px;
      left: 32px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #e0e0e0;
      background: rgba(28, 28, 27, 0.75);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 3px solid #e84b32;
      pointer-events: none;
      z-index: 20;
    }
    .hud-top-right {
      position: absolute;
      top: 28px;
      right: 32px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #a0a0a0;
      background: rgba(28, 28, 27, 0.75);
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-top-right span.pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e84b32;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .hud-elevation-ruler {
      position: absolute;
      right: 36px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column-reverse;
      gap: 16px;
      pointer-events: none;
      z-index: 15;
    }
    .elevation-mark {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #666;
      transition: color 0.3s ease;
    }
    .elevation-mark.active {
      color: #e84b32;
      font-weight: bold;
    }
    .elevation-mark::before {
      content: "";
      width: 14px;
      height: 1px;
      background: currentColor;
    }
    .progress-bar-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 30;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #e84b32;
      transition: width 0.1s ease-out;
    }
  </style>
</head>
<body>

  <div class="scroll-track">
    <div class="viewport">
      <div class="hud-top-right">
        <span class="pulse"></span>
        SCROLL TO CONSTRUCT ↓
      </div>

      <div class="hud-elevation-ruler" id="ruler">
        <div class="elevation-mark" data-level="0">+0.00</div>
        <div class="elevation-mark" data-level="1">+3.60</div>
        <div class="elevation-mark" data-level="2">+7.20</div>
        <div class="elevation-mark" data-level="3">+10.80</div>
        <div class="elevation-mark" data-level="4">+14.40</div>
        <div class="elevation-mark" data-level="5">+18.00</div>
        <div class="elevation-mark" data-level="6">+21.60</div>
        <div class="elevation-mark" data-level="7">+25.20</div>
        <div class="elevation-mark" data-level="8">+28.80</div>
        <div class="elevation-mark" data-level="9">+32.40</div>
        <div class="elevation-mark" data-level="10">+36.00</div>
      </div>

      <div class="hud-bottom-left" id="stage-label">01 / 11 — SITE GRID & DATUM</div>

      <canvas id="cad-canvas"></canvas>

      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- CDN Three.js & GSAP ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const canvas = document.getElementById("cad-canvas");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e1e);

    // Isometric Orthographic Camera setup
    const aspect = window.innerWidth / window.innerHeight;
    const d = 15;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    // True isometric projection angle
    camera.position.set(24, 24, 24);
    camera.lookAt(0, 4.5, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Materials
    const darkFillMat = new THREE.MeshBasicMaterial({
      color: 0x222222,
      polygonOffset: true,
      polygonOffsetFactor: 1,
      polygonOffsetUnits: 1
    });
    const whiteLineMat = new THREE.LineBasicMaterial({ color: 0xdcdcdc, linewidth: 1.5 });
    const orangeLineMat = new THREE.LineBasicMaterial({ color: 0xe84b32, linewidth: 2 });
    const faintGridMat = new THREE.LineBasicMaterial({ color: 0x363636 });

    // CAD Box Helper
    function createCADBox(w, h, depth, x, y, z, edgeMat = whiteLineMat, isSolid = true) {
      const group = new THREE.Group();
      const geo = new THREE.BoxGeometry(w, h, depth);

      if (isSolid) {
        const mesh = new THREE.Mesh(geo, darkFillMat);
        group.add(mesh);
      }

      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, edgeMat);
      group.add(line);

      group.position.set(x, y, z);
      group.scale.set(0.001, 0.001, 0.001);
      group.visible = false;
      scene.add(group);
      return group;
    }

    // 1. SITE GRID & DATUM MARKERS
    const gridHelper = new THREE.GridHelper(36, 18, 0x484848, 0x2a2a2a);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // Orange corner datum squares
    const datumCoords = [[-9, 7.5], [9, 7.5], [-9, -7.5], [9, -7.5]];
    datumCoords.forEach(([mx, mz]) => {
      const mGeo = new THREE.PlaneGeometry(0.4, 0.4);
      const mMat = new THREE.MeshBasicMaterial({ color: 0xe84b32, side: THREE.DoubleSide });
      const marker = new THREE.Mesh(mGeo, mMat);
      marker.rotation.x = -Math.PI / 2;
      marker.position.set(mx, 0.02, mz);
      scene.add(marker);
    });

    // Outer Boundary Dashed Frame
    const boundaryPts = [
      new THREE.Vector3(-9, 0.02, -7.5),
      new THREE.Vector3(9, 0.02, -7.5),
      new THREE.Vector3(9, 0.02, 7.5),
      new THREE.Vector3(-9, 0.02, 7.5),
      new THREE.Vector3(-9, 0.02, -7.5)
    ];
    const boundaryGeo = new THREE.BufferGeometry().setFromPoints(boundaryPts);
    const boundaryLine = new THREE.Line(boundaryGeo, new THREE.LineDashedMaterial({
      color: 0x666666,
      dashSize: 0.5,
      gapSize: 0.25
    }));
    boundaryLine.computeLineDistances();
    scene.add(boundaryLine);

    // 2. TOWER CRANE (ORANGE LATTICE WIREFRAME)
    const craneGroup = new THREE.Group();
    scene.add(craneGroup);

    const craneMast = createCADBox(0.8, 17, 0.8, -5.5, 8.5, -5.5, orangeLineMat, false);
    const craneJib = createCADBox(14, 0.7, 0.7, -0.5, 17.3, -5.5, orangeLineMat, false);
    const craneCounter = createCADBox(1.8, 1.3, 1.3, -7.8, 17.3, -5.5, orangeLineMat, true);
    const craneCable = createCADBox(0.04, 6, 0.04, 3.2, 13.8, -5.5, orangeLineMat, false);
    const craneHook = createCADBox(1.1, 0.4, 1.1, 3.2, 10.6, -5.5, orangeLineMat, false);

    // 3. BUILDING MODEL - MODULAR PROGRESSIVE STAGES
    // Foundation Podium
    const foundation = createCADBox(11, 1.8, 8, 0, 0.9, 0);
    const podiumSlab = createCADBox(11.4, 0.35, 8.4, 0, 1.95, 0);

    // Central Shear Core
    const core1 = createCADBox(2.8, 3.2, 2.2, 0, 3.6, 0);
    const core2 = createCADBox(2.8, 3.6, 2.2, 0, 7.0, 0);
    const core3 = createCADBox(2.8, 3.6, 2.2, 0, 10.6, 0);

    // Columns generator for floors
    const colX = [-4.4, -2.2, 2.2, 4.4];
    const colZ = [-3.2, 0, 3.2];

    function createFloorColumns(baseY, height = 2.6) {
      const cols = [];
      colX.forEach(x => {
        colZ.forEach(z => {
          if (Math.abs(x) < 2.0 && Math.abs(z) < 1.5) return; // Core clearance
          cols.push(createCADBox(0.38, height, 0.38, x, baseY + height / 2, z));
        });
      });
      return cols;
    }

    // Floor 1 (Ground)
    const colsFloor1 = createFloorColumns(2.1, 2.6);
    const beamsFloor1 = [
      createCADBox(9.6, 0.3, 0.3, 0, 4.8, -3.2, orangeLineMat),
      createCADBox(9.6, 0.3, 0.3, 0, 4.8, 3.2, orangeLineMat),
      createCADBox(0.3, 0.3, 6.7, -4.4, 4.8, 0, orangeLineMat),
      createCADBox(0.3, 0.3, 6.7, 4.4, 4.8, 0, orangeLineMat)
    ];
    const slab1 = createCADBox(10.6, 0.35, 7.6, 0, 5.0, 0);

    // Floor 2
    const colsFloor2 = createFloorColumns(5.2, 2.4);
    const slab2 = createCADBox(10.2, 0.32, 7.2, 0, 7.8, 0);

    // Floor 3
    const colsFloor3 = createFloorColumns(8.0, 2.4);
    const slab3 = createCADBox(10.2, 0.32, 7.2, 0, 10.6, 0);

    // Upper Tower Floors (Floors 4 to 7 Stacked)
    const upperTower = createCADBox(9.8, 8.4, 6.8, 0, 15.0, 0);

    // Roof & Penthouse Plant Room
    const roofSlab = createCADBox(10.2, 0.4, 7.2, 0, 19.4, orangeLineMat);
    const penthouse = createCADBox(3.4, 1.4, 2.6, 0, 20.3, 0);
    const hvac1 = createCADBox(1.5, 0.9, 1.2, -2.6, 20.0, 1.2);
    const hvac2 = createCADBox(1.5, 0.9, 1.2, 2.6, 20.0, 1.2);

    // Entrance Canopy on Ground Floor
    const canopy = createCADBox(2.8, 0.15, 1.6, 0, 2.8, 4.3, orangeLineMat);

    // 4. GSAP SCROLL TIMELINE (11 STAGES)
    const stageLabels = [
      "01 / 11 — SITE GRID & DATUM",
      "02 / 11 — TOWER CRANE ERECTION",
      "03 / 11 — SUBSTRUCTURE PODIUM",
      "04 / 11 — PODIUM SLAB & CORE",
      "05 / 11 — GROUND LEVEL COLUMNS",
      "06 / 11 — LEVEL 01 PRIMARY BEAMS",
      "07 / 11 — LEVEL 01 SLAB POUR",
      "08 / 11 — LEVEL 02 COLUMNS & SLAB",
      "09 / 11 — LEVEL 03 STRUCTURAL FRAME",
      "10 / 11 — TOWER FLOORS & FACADE",
      "11 / 11 — ROOF PLANT & TOPPING OUT"
    ];

    const labelEl = document.getElementById("stage-label");
    const progressBar = document.getElementById("progress-bar");
    const rulerMarks = document.querySelectorAll(".elevation-mark");

    function reveal(targets, tl, position, stagger = 0.03) {
      const list = Array.isArray(targets) ? targets : [targets];
      tl.to(list.map(t => t.scale), {
        x: 1, y: 1, z: 1,
        duration: 0.6,
        stagger: stagger,
        ease: "power2.out",
        onStart: () => list.forEach(t => (t.visible = true)),
        onReverseComplete: () => list.forEach(t => (t.visible = false))
      }, position);
    }

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".scroll-track",
        start: "top top",
        end: "bottom bottom",
        scrub: 0.5,
        onUpdate: (self) => {
          const progress = self.progress;
          progressBar.style.width = (progress * 100) + "%";

          const stageIdx = Math.min(
            stageLabels.length - 1,
            Math.floor(progress * stageLabels.length)
          );
          labelEl.textContent = stageLabels[stageIdx];

          // Update elevation marks
          const activeLevel = Math.floor(progress * 10);
          rulerMarks.forEach(mark => {
            const lvl = parseInt(mark.getAttribute("data-level"), 10);
            if (lvl <= activeLevel) {
              mark.classList.add("active");
            } else {
              mark.classList.remove("active");
            }
          });
        }
      }
    });

    // Sequence stages along scroll progress
    reveal([craneMast, craneJib, craneCounter], tl, 0.1, 0.08);
    reveal([craneCable, craneHook], tl, 0.4, 0.04);
    reveal(foundation, tl, 0.8);
    reveal([podiumSlab, core1], tl, 1.4);
    reveal(colsFloor1, tl, 2.0, 0.03);
    reveal(beamsFloor1, tl, 2.7, 0.05);
    reveal([slab1, canopy], tl, 3.4);
    reveal([core2, ...colsFloor2], tl, 4.0, 0.02);
    reveal(slab2, tl, 4.6);
    reveal([core3, ...colsFloor3], tl, 5.2, 0.02);
    reveal(slab3, tl, 5.7);
    reveal(upperTower, tl, 6.3);
    reveal([roofSlab, penthouse, hvac1, hvac2], tl, 7.0, 0.05);

    // Crane hook motion synchronized with construction
    tl.to([craneCable.position, craneHook.position], {
      y: "+=3.5",
      duration: 6,
      ease: "none"
    }, 1.5);

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Responsive Orthographic resize
    window.addEventListener("resize", () => {
      const a = window.innerWidth / window.innerHeight;
      camera.left = -d * a;
      camera.right = d * a;
      camera.top = d;
      camera.bottom = -d;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
