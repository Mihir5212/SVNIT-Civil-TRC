<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Preview site: keeps search engines from listing it. Remove this line when the site becomes official. -->
<meta name="robots" content="noindex">
<title>Contact | TRC, SVNIT Surat</title>
<meta name="description" content="Send an enquiry to the TEP Research &amp; Consultancy Cell (TRC), SVNIT Surat.">
<meta name="theme-color" content="#03060c">
<link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
<noscript><p class="noscript">This website needs JavaScript turned on to show its content.</p></noscript>
<section class="page-head">
    <div class="wrap">
        <div class="board gantry-board">
            <div class="board-face gantry-face">
                <div class="gantry-text">
                    <h1>Send an enquiry</h1>
                    <p class="lead">Tell us what you need studied or reviewed. The relevant faculty member will get back to you.</p>
                </div>
                <span class="pict" data-pict="mail" aria-hidden="true"></span>
            </div>
        </div>
    </div>
</section>

<section class="section">
    <div class="wrap contact-layout">
        <div class="contact-form-wrap sign-plate">
            <div id="form-status" class="notice" role="status" tabindex="-1" hidden></div>
            <form id="enquiry-form" class="form" novalidate>
                <div class="form-row">
                    <label class="field"><span>Your name</span>
                        <input type="text" name="name" required autocomplete="name"></label>
                    <label class="field"><span>Organisation <em>(optional)</em></span>
                        <input type="text" name="organisation" autocomplete="organization"></label>
                </div>
                <div class="form-row">
                    <label class="field"><span>Email</span>
                        <input type="email" name="email" required autocomplete="email"></label>
                    <label class="field"><span>Phone <em>(optional)</em></span>
                        <input type="tel" name="phone" autocomplete="tel"></label>
                </div>
                <label class="field"><span>Type of work</span>
                    <select name="work" required>
                        <option value="">Choose one</option>
                    </select></label>
                <label class="field"><span>About the project</span>
                    <textarea name="message" rows="7" required placeholder="Location, the problem you want studied, expected timeline and any deadlines"></textarea></label>
                <div class="hp" aria-hidden="true">
                    <label>Leave this empty <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
                </div>
                <p class="form-note" id="form-note"></p>
                <div><button type="submit" class="btn btn-primary btn-lg">Send enquiry</button></div>
            </form>
        </div>

        <aside class="contact-details">
            <div class="board board-blue contact-board">
                <div class="board-face">
                    <div class="contact-board-head">
                        <span class="pict" data-pict="info" aria-hidden="true"></span>
                        <h2>Contact details</h2>
                    </div>
                    <dl>
                        <div><dt>Address</dt><dd><address id="contact-address"></address></dd></div>
                        <div><dt>Email</dt><dd><a data-email href="#"></a></dd></div>
                        <div><dt>Phone</dt><dd><a data-phone href="#"></a></dd></div>
                        <div><dt>Office hours</dt><dd id="contact-hours"></dd></div>
                    </dl>
                </div>
            </div>
            <div class="map" id="contact-map"></div>
        </aside>
    </div>
</section>

</main>

<div id="site-footer"></div>
<!-- data.js holds the content; main.js builds the pages from it -->
<script src="assets/js/data.js"></script>
<script src="assets/js/night-road.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
