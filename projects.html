<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Research &amp; Projects | TRC, SVNIT Surat</title>
<meta name="description" content="Ongoing and completed research and consultancy projects of TRC, SVNIT Surat.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var a=JSON.parse(sessionStorage.getItem('trc-arrival')||'null');if(a&&Date.now()-a.t<15000){document.documentElement.className='arrived arrived-'+a.dir;}}catch(e){}</script>
</head>
<body data-page="projects">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
<noscript><p class="noscript">This website needs JavaScript turned on to show its content.</p></noscript>
<section class="hero hero-projects">
    <div class="wrap">
        <div id="arrival-slot"></div>
        <div class="hero-row">
            <div>
                <p class="eyebrow">TEP Research &amp; Consultancy Cell</p>
                <h1>Research &amp; Projects</h1>
            </div>
            <p class="lead">Consultancy and sponsored research projects, ongoing and completed.</p>
        </div>
    </div>
    <div class="hero-art hero-art-wide" data-art="projects"></div>
</section>

<section class="section section-after-art">
    <div class="wrap">
        <div class="filters">
            <div class="chips" id="status-chips" role="group" aria-label="Project status"></div>
            <label class="select-label">
                <span>Area of work</span>
                <select id="sector-select"></select>
            </label>
        </div>
        <p class="result-count" id="result-count"></p>
        <div class="project-grid" id="project-grid"></div>
        <div class="empty" id="projects-empty"></div>
    </div>
</section>

</main>

<div id="site-footer"></div>
<!-- data.js holds the content; art.js has the drawings; main.js builds the pages from them -->
<script src="assets/js/data.js"></script>
