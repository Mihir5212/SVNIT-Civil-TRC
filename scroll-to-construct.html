<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll to Construct — Isometric CAD Blueprint</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1c1c1b;
      color: #e0e0e0;
      font-family: "Courier New", Courier, monospace;
      overflow-x: hidden;
    }
    .scroll-track {
      height: 600vh;
      position: relative;
    }
    .viewport {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #242422 0%, #161615 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud-bottom-left {
      position: absolute;
      bottom: 28px;
      left: 32px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #e0e0e0;
      background: rgba(28, 28, 27, 0.9);
      backdrop-filter: blur(6px);
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 4px solid #e84b32;
      pointer-events: none;
      z-index: 20;
      max-width: 480px;
    }
    .hud-bottom-left .desc {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      letter-spacing: 1px;
    }
    .hud-top-right {
      position: absolute;
      top: 24px;
      right: 28px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #a0a0a0;
      background: rgba(28, 28, 27, 0.85);
      backdrop-filter: blur(4px);
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-top-left {
      position: absolute;
      top: 24px;
      left: 28px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #e0e0e0;
      background: rgba(28, 28, 27, 0.85);
      backdrop-filter: blur(4px);
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e84b32;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .hud-elevation-ruler {
      position: absolute;
      right: 36px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column-reverse;
      gap: 12px;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .hud-elevation-ruler.visible {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    .elevation-mark {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #666;
      transition: color 0.2s ease;
    }
    .elevation-mark.active {
      color: #e84b32;
      font-weight: bold;
    }
    .elevation-mark::before {
      content: "";
      width: 14px;
      height: 1px;
      background: currentColor;
    }
    .progress-bar-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 30;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #e84b32;
      transition: width 0.08s ease-out;
    }
  </style>
</head>
<body>

  <div class="scroll-track">
    <div class="viewport">
      <div class="hud-top-left">
        <span class="pulse-dot"></span>
        <span id="view-mode-label">2D CAD PLAN VIEW</span>
      </div>

      <div class="hud-top-right">
        <span>SCROLL TO CONSTRUCT ↓</span>
      </div>

      <div class="hud-elevation-ruler" id="ruler">
        <div class="elevation-mark">+0.00</div>
        <div class="elevation-mark">+3.60</div>
        <div class="elevation-mark">+7.20</div>
        <div class="elevation-mark">+10.80</div>
        <div class="elevation-mark">+14.40</div>
        <div class="elevation-mark">+18.00</div>
        <div class="elevation-mark">+21.60</div>
        <div class="elevation-mark">+25.20</div>
        <div class="elevation-mark">+28.80</div>
        <div class="elevation-mark">+32.40</div>
        <div class="elevation-mark active">+36.00</div>
      </div>

      <div class="hud-bottom-left">
        <div id="stage-label">01 / 11 — 2D CAD SITE PLAN & DATUM</div>
        <div class="desc" id="stage-desc">Raw structural datum & grid layout — Scroll to tilt into 3D isometric space</div>
      </div>

      <canvas id="cad-canvas"></canvas>

      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- CDN Three.js & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const canvas = document.getElementById("cad-canvas");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1c1c1b);

    const aspect = window.innerWidth / window.innerHeight;
    const d = 26; // Generous view size to avoid clipping crane or tower
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 2000);

    // Initial: Top-Down Plan View
    camera.position.set(0, 48, 0.001);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Materials
    const darkFillMat = new THREE.MeshBasicMaterial({
      color: 0x242422,
      polygonOffset: true,
      polygonOffsetFactor: 1,
      polygonOffsetUnits: 1
    });
    const whiteLineMat = new THREE.LineBasicMaterial({ color: 0xd8d8d6, linewidth: 1.5 });
    const orangeLineMat = new THREE.LineBasicMaterial({ color: 0xe84b32, linewidth: 2 });
    const faintLineMat = new THREE.LineBasicMaterial({ color: 0x484846 });
    const dashedLineMat = new THREE.LineDashedMaterial({
      color: 0x767672,
      dashSize: 0.6,
      gapSize: 0.35
    });

    function createCADBox(w, h, depth, x, y, z, edgeMat = whiteLineMat, isSolid = true) {
      const group = new THREE.Group();
      const geo = new THREE.BoxGeometry(w, h, depth);

      if (isSolid) {
        const mesh = new THREE.Mesh(geo, darkFillMat);
        group.add(mesh);
      }

      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, edgeMat);
      group.add(line);

      group.position.set(x, y, z);
      group.scale.set(0.0001, 0.0001, 0.0001);
      group.visible = false;
      scene.add(group);
      return group;
    }

    function create2DLine(x1, z1, x2, z2, mat = faintLineMat) {
      const pts = [new THREE.Vector3(x1, 0.02, z1), new THREE.Vector3(x2, 0.02, z2)];
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const line = new THREE.Line(geo, mat);
      if (mat.isLineDashedMaterial) line.computeLineDistances();
      return line;
    }

    // 1. 2D RAW CAD BLUEPRINT BOARD (Plan View - Image 3)
    const rawBoardGroup = new THREE.Group();
    scene.add(rawBoardGroup);

    const gridHelper = new THREE.GridHelper(52, 26, 0x3d3d3a, 0x2a2a28);
    gridHelper.position.y = 0.005;
    rawBoardGroup.add(gridHelper);

    const bx = 12;
    const bz = 7.2;
    const bPts = [
      new THREE.Vector3(-bx - 2, 0.02, -bz - 2),
      new THREE.Vector3(bx + 2, 0.02, -bz - 2),
      new THREE.Vector3(bx + 2, 0.02, bz + 2),
      new THREE.Vector3(-bx - 2, 0.02, bz + 2),
      new THREE.Vector3(-bx - 2, 0.02, -bz - 2)
    ];
    const bGeo = new THREE.BufferGeometry().setFromPoints(bPts);
    const bLine = new THREE.Line(bGeo, dashedLineMat);
    bLine.computeLineDistances();
    rawBoardGroup.add(bLine);

    [[-bx - 2, -bz - 2], [bx + 2, -bz - 2], [bx + 2, bz + 2], [-bx - 2, bz + 2]].forEach(([mx, mz]) => {
      const mGeo = new THREE.PlaneGeometry(0.5, 0.5);
      const mMat = new THREE.MeshBasicMaterial({ color: 0xe84b32, side: THREE.DoubleSide });
      const mMesh = new THREE.Mesh(mGeo, mMat);
      mMesh.rotation.x = -Math.PI / 2;
      mMesh.position.set(mx, 0.03, mz);
      rawBoardGroup.add(mMesh);
    });

    const gridColsX = [-12, -7.2, -2.4, 2.4, 7.2, 12];
    const gridRowsZ = [-7.2, -2.4, 2.4, 7.2];

    gridColsX.forEach((gx) => {
      rawBoardGroup.add(create2DLine(gx, -bz - 2.8, gx, bz + 2.8, dashedLineMat));
    });
    gridRowsZ.forEach((gz) => {
      rawBoardGroup.add(create2DLine(-bx - 2.8, gz, bx + 2.8, gz, dashedLineMat));
    });

    gridColsX.forEach((gx) => {
      gridRowsZ.forEach((gz) => {
        const padGeo = new THREE.PlaneGeometry(0.5, 0.5);
        const padMat = new THREE.MeshBasicMaterial({ color: 0x50504c, side: THREE.DoubleSide });
        const pad = new THREE.Mesh(padGeo, padMat);
        pad.rotation.x = -Math.PI / 2;
        pad.position.set(gx, 0.03, gz);
        rawBoardGroup.add(pad);
      });
    });

    // Hatched Core Footprint
    const coreFootprint = new THREE.Group();
    const coreOutlinePts = [
      new THREE.Vector3(-2.2, 0.03, -1.8),
      new THREE.Vector3(2.2, 0.03, -1.8),
      new THREE.Vector3(2.2, 0.03, 1.8),
      new THREE.Vector3(-2.2, 0.03, 1.8),
      new THREE.Vector3(-2.2, 0.03, -1.8)
    ];
    coreFootprint.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(coreOutlinePts), whiteLineMat));
    for (let h = -2.0; h <= 2.0; h += 0.5) {
      coreFootprint.add(create2DLine(h - 0.8, -1.7, h + 0.8, 1.7, faintLineMat));
    }
    rawBoardGroup.add(coreFootprint);

    const dimOrangeMat = new THREE.LineBasicMaterial({ color: 0xe84b32 });
    rawBoardGroup.add(create2DLine(-12, bz + 2.2, 12, bz + 2.2, dimOrangeMat));
    rawBoardGroup.add(create2DLine(bx + 2.2, -7.2, bx + 2.2, 7.2, dimOrangeMat));

    // 2. TOWER CRANE (ORANGE WIREFRAME)
    const craneGroup = new THREE.Group();
    scene.add(craneGroup);

    const craneX = 9.5;
    const craneZ = -8.5;
    const craneMast = createCADBox(0.9, 23, 0.9, craneX, 11.5, craneZ, orangeLineMat, false);
    const craneJib = createCADBox(17, 0.8, 0.8, craneX - 4.5, 23.4, craneZ, orangeLineMat, false);
    const craneCounter = createCADBox(2.2, 1.4, 1.4, craneX + 5.5, 23.4, craneZ, orangeLineMat, true);
    const craneCable = createCADBox(0.04, 8, 0.04, craneX - 7.5, 18.0, craneZ + 4.5, orangeLineMat, false);
    const craneHook = createCADBox(1.2, 0.45, 1.2, craneX - 7.5, 13.8, craneZ + 4.5, orangeLineMat, false);

    // 3. 3D BUILDING MODEL (Matches Reference Image 4)
    const podiumSubstructure = createCADBox(18.5, 1.8, 12.5, 0, 0.9, 0);
    const podiumSlab1 = createCADBox(19.0, 0.35, 13.0, 0, 1.95, 0);

    const podiumCols = [];
    const pColsX = [-8.8, -4.4, 0, 4.4, 8.8];
    const pColsZ = [-5.8, 0, 5.8];
    pColsX.forEach((px) => {
      pColsZ.forEach((pz) => {
        if (Math.abs(px) < 3 && Math.abs(pz) < 2) return;
        podiumCols.push(createCADBox(0.38, 2.2, 0.38, px, 3.1, pz));
      });
    });
    const podiumRoofSlab = createCADBox(19.2, 0.4, 13.2, 0, 4.3, 0);

    const entranceCanopy = createCADBox(4.2, 0.18, 2.2, 0, 3.1, 6.7, orangeLineMat);

    // Red Logo "G" above canopy
    const logoGroup = new THREE.Group();
    const logoCirclePts = [];
    for (let a = 0; a <= Math.PI * 2; a += Math.PI / 16) {
      logoCirclePts.push(new THREE.Vector3(Math.cos(a) * 0.7, Math.sin(a) * 0.7, 0));
    }
    const logoCircle = new THREE.Line(new THREE.BufferGeometry().setFromPoints(logoCirclePts), orangeLineMat);
    const gBarPts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.5, 0, 0), new THREE.Vector3(0.5, -0.4, 0)];
    const gBar = new THREE.Line(new THREE.BufferGeometry().setFromPoints(gBarPts), orangeLineMat);
    logoGroup.add(logoCircle, gBar);
    logoGroup.position.set(0, 3.8, 6.65);
    logoGroup.scale.set(0.0001, 0.0001, 0.0001);
    logoGroup.visible = false;
    scene.add(logoGroup);

    const coreT1 = createCADBox(3.4, 3.8, 2.6, 0, 4.2, 0);
    const coreT2 = createCADBox(3.4, 6.0, 2.6, 0, 9.1, 0);
    const coreT3 = createCADBox(3.4, 6.0, 2.6, 0, 15.1, 0);

    const towerFloors = [];
    const towerColumns = [];
    const tColX = [-5.6, -2.8, 2.8, 5.6];
    const tColZ = [-3.8, 0, 3.8];
    const floorHeights = [6.2, 8.1, 10.0, 11.9, 13.8, 15.7, 17.6];
    floorHeights.forEach((fy) => {
      towerFloors.push(createCADBox(12.8, 0.32, 9.2, -0.5, fy, 0));
      tColX.forEach((cx) => {
        tColZ.forEach((cz) => {
          if (Math.abs(cx) < 2.0 && Math.abs(cz) < 1.6) return;
          towerColumns.push(createCADBox(0.34, 1.6, 0.34, cx - 0.5, fy - 0.95, cz));
        });
      });
    });

    const towerFacade = createCADBox(12.6, 13.4, 9.0, -0.5, 11.0, 0, whiteLineMat, true);
    const roofSlab = createCADBox(13.0, 0.38, 9.4, -0.5, 17.9, orangeLineMat);
    const parapet = createCADBox(13.0, 0.6, 9.4, -0.5, 18.3, whiteLineMat, false);
    const plantRoom = createCADBox(4.4, 1.8, 3.2, -0.5, 19.3, whiteLineMat);

    const antennaGroup = new THREE.Group();
    const antennaPts = [new THREE.Vector3(-0.5, 20.2, 0), new THREE.Vector3(-0.5, 23.0, 0)];
    antennaGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(antennaPts), orangeLineMat));
    const antNode = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: 0xe84b32 }));
    antNode.position.set(-0.5, 23.0, 0);
    antennaGroup.add(antNode);
    antennaGroup.scale.set(0.0001, 0.0001, 0.0001);
    antennaGroup.visible = false;
    scene.add(antennaGroup);

    const hvacChillers = [];
    [-3.0, 2.0].forEach((hx) => {
      hvacChillers.push(createCADBox(2.2, 1.1, 1.8, hx - 0.5, 18.9, 1.2));
    });

    // 4. GSAP TIMELINE SEQUENCE
    let targetProgress = 0;
    let currentProgress = 0;

    const revealGroup = (targets, tl, pos, stagger = 0.02) => {
      const list = Array.isArray(targets) ? targets : [targets];
      tl.to(
        list.map((t) => t.scale),
        {
          x: 1, y: 1, z: 1,
          duration: 0.6,
          stagger,
          ease: 'power2.out',
          onStart: () => list.forEach((t) => (t.visible = true)),
          onReverseComplete: () => list.forEach((t) => (t.visible = false))
        },
        pos
      );
    };

    const tl = gsap.timeline({ paused: true });

    revealGroup([craneMast, craneJib, craneCounter], tl, 0.16, 0.08);
    revealGroup([craneCable, craneHook], tl, 0.24, 0.04);
    revealGroup([podiumSubstructure, podiumSlab1], tl, 0.30, 0.05);
    revealGroup([coreT1, ...podiumCols], tl, 0.38, 0.02);
    revealGroup([podiumRoofSlab, entranceCanopy, logoGroup], tl, 0.46, 0.04);
    revealGroup([coreT2, towerFloors[0], towerFloors[1], towerFloors[2], ...towerColumns.slice(0, 30)], tl, 0.54, 0.015);
    revealGroup([coreT3, towerFloors[3], towerFloors[4], towerFloors[5], ...towerColumns.slice(30), towerFacade], tl, 0.66, 0.02);
    revealGroup([towerFloors[6], roofSlab, parapet], tl, 0.76, 0.04);
    revealGroup([plantRoom, antennaGroup, ...hvacChillers], tl, 0.84, 0.03);

    // Crane scales away at final topping out
    tl.to(craneGroup.scale, {
      x: 0.0001, y: 0.0001, z: 0.0001,
      duration: 0.5,
      ease: 'power2.inOut',
      onComplete: () => { craneGroup.visible = false; },
      onReverseComplete: () => { craneGroup.visible = true; }
    }, 0.90);

    tl.to([craneCable.position, craneHook.position], {
      y: '+=5.0',
      duration: 5,
      ease: 'none'
    }, 0.28);

    ScrollTrigger.create({
      trigger: ".scroll-track",
      start: "top top",
      end: "bottom bottom",
      scrub: 1.2,
      onUpdate: (self) => {
        targetProgress = self.progress;
      }
    });

    // 5. SMOOTH RENDER LOOP
    const STAGE_LABELS = [
      '01 / 11 — 2D CAD SITE PLAN & DATUM',
      '02 / 11 — AXONOMETRIC 3D ROTATION',
      '03 / 11 — TOWER CRANE ERECTION',
      '04 / 11 — SUBSTRUCTURE PODIUM',
      '05 / 11 — PODIUM SLAB & CORE',
      '06 / 11 — GROUND LEVEL & ENTRANCE CANOPY',
      '07 / 11 — TYPICAL TOWER FRAMING',
      '08 / 11 — CURTAIN WALL & MULLIONS',
      '09 / 11 — UPPER LEVELS TO TOP',
      '10 / 11 — ROOF PLANT & HVAC CHILLERS',
      '11 / 11 — TOPPING OUT COMPLETE (+36.00m)'
    ];

    const labelEl = document.getElementById("stage-label");
    const descEl = document.getElementById("stage-desc");
    const modeEl = document.getElementById("view-mode-label");
    const rulerEl = document.getElementById("ruler");
    const progressBar = document.getElementById("progress-bar");

    const planCamPos = new THREE.Vector3(0, 48, 0.001);
    const planTarget = new THREE.Vector3(0, 0, 0);

    const isoCamPos = new THREE.Vector3(30, 28, 30);
    const isoTarget = new THREE.Vector3(0, 9.5, 0);

    const finalCamPos = new THREE.Vector3(26, 23, 26);
    const finalTarget = new THREE.Vector3(-0.5, 10.5, 0);

    const curCamPos = new THREE.Vector3().copy(planCamPos);
    const curTarget = new THREE.Vector3().copy(planTarget);

    function animate() {
      requestAnimationFrame(animate);

      currentProgress += (targetProgress - currentProgress) * 0.09;
      tl.progress(currentProgress);
      progressBar.style.width = (currentProgress * 100) + "%";

      const stageIdx = Math.min(STAGE_LABELS.length - 1, Math.floor(currentProgress * STAGE_LABELS.length));
      labelEl.textContent = STAGE_LABELS[stageIdx];

      if (currentProgress < 0.20) {
        modeEl.textContent = "2D CAD PLAN VIEW";
        descEl.textContent = "Raw structural datum & grid layout — Scroll to tilt into 3D isometric space";
        rulerEl.classList.remove("visible");
        const t = Math.min(currentProgress / 0.20, 1.0);
        const easeT = 0.5 - 0.5 * Math.cos(Math.PI * t);
        curCamPos.lerpVectors(planCamPos, isoCamPos, easeT);
        curTarget.lerpVectors(planTarget, isoTarget, easeT);
      } else if (currentProgress >= 0.85) {
        modeEl.textContent = "TOPPED OUT ARCHITECTURAL VIEW";
        descEl.textContent = "Tower completed — Crane dismantled, finished facade & +36.00m elevation benchmark";
        rulerEl.classList.add("visible");
        const t = Math.min((currentProgress - 0.85) / 0.15, 1.0);
        const easeT = 0.5 - 0.5 * Math.cos(Math.PI * t);
        curCamPos.lerpVectors(isoCamPos, finalCamPos, easeT);
        curTarget.lerpVectors(isoTarget, finalTarget, easeT);
      } else {
        modeEl.textContent = "ISOMETRIC 3D CAD BLUEPRINT";
        descEl.textContent = `Step ${stageIdx + 1} of 11 — Real-time parametric structural assembly`;
        rulerEl.classList.remove("visible");
        curCamPos.copy(isoCamPos);
        curTarget.copy(isoTarget);
      }

      camera.position.copy(curCamPos);
      camera.lookAt(curTarget);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      const a = window.innerWidth / window.innerHeight;
      camera.left = -d * a;
      camera.right = d * a;
      camera.top = d;
      camera.bottom = -d;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
